<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" stroke="url(#gold)" stroke-width="6" opacity="0.4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="190" stroke="url(#gold)" stroke-width="3" opacity="0.7"/>

  <!-- MTG Mana Star / Planeswalker fork rays -->
  <path d="M256 60 L275 160 L360 110 L305 195 L405 215 L315 256 L405 297 L305 317 L360 402 L275 352 L256 452 L237 352 L152 402 L207 317 L107 297 L197 256 L107 215 L207 195 L152 110 L237 160 Z" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.3"/>

  <!-- Judge Scales & Gavel of Rule Central Symbol -->
  <g transform="translate(256, 256)">
    <!-- Central Staff / Blade -->
    <path d="M0 -130 L10 -80 L6 130 L0 145 L-6 130 L-10 -80 Z" fill="url(#gold)"/>
    <circle cx="0" cy="-135" r="12" fill="#fef08a"/>

    <!-- Scales Beam -->
    <path d="M-110 -50 Q0 -65 110 -50" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Left pan strings & pan -->
    <line x1="-100" y1="-48" x2="-125" y2="25" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-100" y1="-48" x2="-75" y2="25" stroke="#94a3b8" stroke-width="2"/>
    <path d="M-135 25 Q-100 50 -65 25 Z" fill="url(#gold)"/>

    <!-- Right pan strings & pan -->
    <line x1="100" y1="-48" x2="75" y2="25" stroke="#94a3b8" stroke-width="2"/>
    <line x1="100" y1="-48" x2="125" y2="25" stroke="#94a3b8" stroke-width="2"/>
    <path d="M65 25 Q100 50 135 25 Z" fill="url(#gold)"/>

    <!-- Magic Rulebook Eye / Arcane gem -->
    <circle cx="0" cy="-20" r="18" fill="#38bdf8"/>
    <circle cx="0" cy="-20" r="10" fill="#ffffff"/>
  </g>
</svg>
